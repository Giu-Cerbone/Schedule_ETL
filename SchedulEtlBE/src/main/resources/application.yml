spring:
  datasource:
    url: jdbc:h2:file:${scheduletl.database.directory}/${scheduletl.database.name};MODE=PostgreSQL;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          schema-generation:
            database:
              action: update
            scripts:
              action: create
              create-target: ${scheduletl.database.ddl-directory}/create_schema.sql
  sql:
    init:
      mode: always

server:
  port: 8080

scheduletl:
  database:
    directory: ./mydb
    name: mydb
    ddl-directory: ./ddl_mydb
  admin:
    username: ${SCHEDULETL_ADMIN_USERNAME:admin}
    password: ${SCHEDULETL_ADMIN_PASSWORD:admin}
  process:
    shell:
      enabled: true
      allowed-directory: ./approved-scripts
      timeout-seconds: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
